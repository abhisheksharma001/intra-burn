# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en
tone_instructions: "Be concise, actionable, and focus on correctness, security, and maintainability."
early_access: false

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  poem: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
      - dev

  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.venv/**"
    - "!**/__pycache__/**"

  path_instructions:
    - path: "**/supabase/**"
      instructions: "Review for migration safety, RLS policies, function security, and backward-compatible schema changes."
    - path: "**/*.sql"
      instructions: "Check migration safety, index usage, injection risks, idempotency, and rollback possibility."
    - path: "**/*.test.*"
      instructions: "Ensure tests cover happy paths, edge cases, and failures. Avoid brittle tests."
    - path: ".github/workflows/**"
      instructions: "Validate workflow syntax, secret handling, least-privilege permissions, and runner security."

  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CONTRIBUTING.md"
      - "**/CODING_STANDARDS.md"
  learnings:
    scope: local
  pull_requests:
    scope: local

chat:
  auto_reply: true
